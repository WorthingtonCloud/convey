<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The one thing to do next</title>
<!-- Variant closing / call-to-action (full-bleed). The ask at display size, then up to three numbered next steps in a
     row, and where to go (a link or a contact) at the foot in the signal color. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.kicker { left: var(--bleed-left); top: 96px; width: 600px; color: var(--brand-signal-text); }
.say { left: var(--bleed-left); top: 132px; width: var(--bleed-width); font-size: 64px; line-height: 68px; }
.acts { position: absolute; left: var(--bleed-left); top: 392px; width: var(--bleed-width); display: flex; column-gap: 40px; }
.act { flex: 1; display: flex; column-gap: 18px; padding-top: 24px; border-top: 1px solid var(--brand-rule); }
.disc { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--brand-signal); color: var(--brand-on-signal);
  display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 24px; }
.ah { font-size: 26px; line-height: 32px; }
.at { margin-top: 8px; font-size: 20px; line-height: 28px; color: var(--brand-body); }
.meta { left: var(--bleed-left); top: calc(616px - var(--caveat-row, 0px)); width: var(--bleed-width); font-size: 22px; line-height: 28px; color: var(--brand-signal-text); }
</style>
</head>
<body><section class="slide" data-pattern="closing" data-variant="call-to-action" data-role="full-bleed">
<div class="field" data-id="field"></div>
<p class="abs eyebrow kicker" data-id="kicker" data-bind="content.kicker">What to do next</p>
<h1 class="abs heavy say" data-id="ask" data-bind="headline" data-claims="">The one thing the audience should do, said as an ask</h1>
<div class="acts" data-id="actions">
  <div class="act" data-id="act-1"><p class="disc heavy" data-id="n-1" data-index="content.items.0">1</p><div data-id="act-1-text"><p class="ah heavy" data-id="ah-1" data-bind="content.items.0.head">A next step</p><p class="at" data-id="at-1" data-bind="content.items.0.text" data-claims="">What it takes, in one line.</p></div></div>
  <div class="act" data-id="act-2"><p class="disc heavy" data-id="n-2" data-index="content.items.1">2</p><div data-id="act-2-text"><p class="ah heavy" data-id="ah-2" data-bind="content.items.1.head">A next step</p><p class="at" data-id="at-2" data-bind="content.items.1.text" data-claims="">What it takes, in one line.</p></div></div>
  <div class="act" data-id="act-3"><p class="disc heavy" data-id="n-3" data-index="content.items.2">3</p><div data-id="act-3-text"><p class="ah heavy" data-id="ah-3" data-bind="content.items.2.head">A next step</p><p class="at" data-id="at-3" data-bind="content.items.2.text" data-claims="">What it takes, in one line.</p></div></div>
</div>
<p class="abs heavy meta" data-id="meta" data-bind="content.meta">Where to go: a link, or who to call</p>
</section>
</body></html>
