<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The question this part answers</title>
<!-- Variant section / hero-fade (full-bleed). Two soft glows in the data colors (centred circles, the only radial

     large in the signal color, the question, and one line of what's coming. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
</head>
<body><section class="slide" data-pattern="section" data-variant="hero-fade" data-role="full-bleed">
<div class="field" data-id="field"></div>
<div class="abs" data-id="glow-1" style="left:560px;top:-280px;width:960px;height:960px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--brand-data-2) 50%, transparent) 0%, transparent 70%)"></div>
