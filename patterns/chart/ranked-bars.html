<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The headline says what the ranking shows</title>
<!-- Variant chart / ranked-bars (title-only). Horizontal bars, largest first (order the categories that way in the
     storyboard), every value at its bar's end, the key on the plot's top edge, the qualification under the headline. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.fig { position: absolute; left: var(--brand-margin-left); width: var(--brand-content-width);
  top: calc(var(--top) + 52px); height: calc(var(--bottom) - var(--top) - 88px);
  font-family: var(--brand-font-body); font-weight: var(--brand-weight-body); color: var(--brand-body); --chart-grid: var(--brand-rule); }
</style>
</head>
<body><section class="slide" data-pattern="chart" data-variant="ranked-bars" data-role="title-only">
<h1 class="headline" data-id="headline" data-bind="headline" data-claims="">The headline says what the ranking shows</h1>
<p class="abs quiet" data-id="caveat" data-bind="caveat" style="left:var(--brand-margin-left);top:var(--top);width:var(--brand-content-width);font-size:20px;line-height:28px">The qualification that must stay visible.</p>
<figure class="fig" data-id="chart" data-bind="content.chart" data-claims="" data-chart='{"type": "bar", "categories": ["First", "Second", "Third"], "series": [{"name": "Value", "values": [50, 40, 20], "color": "var(--brand-data-1)"}], "axis": {"min": 0, "max": 60, "step": 20, "format": "{v}"}, "fontSize": 16, "gap": 40, "labels": true, "valueLabelColor": "var(--brand-body)"}'></figure>
<p class="abs small" data-id="source" data-bind="content.source" data-claims="" style="left:var(--brand-margin-left);top:calc(var(--bottom) - 20px);width:var(--brand-content-width)">Source: where the data comes from, and when.</p>
</section>
<script src="chart.js"></script>
</body></html>
