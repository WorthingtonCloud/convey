<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The steps, in order</title>
<!-- Variant steps / row (title-only). Three to five steps as raised panels in one row, each numbered on a signal disc,
     a pointer between each and the next. Bigger type than two-rows: for fewer steps, or a live room. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.row { position: absolute; left: var(--brand-margin-left); top: var(--top); width: var(--brand-content-width);
  height: calc(var(--bottom) - var(--top)); display: flex; column-gap: 28px; }
.step { flex: 1; position: relative; background: var(--brand-raised); padding: 28px 24px; }
.tip { position: absolute; right: -24px; top: calc(50% - 18px); color: var(--brand-raised); }
.step:last-child .tip { display: none; }
.disc { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-signal); color: var(--brand-on-signal);
  display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 28px; }
.t { margin-top: 24px; font-size: 28px; line-height: 32px; }
.d { margin-top: 12px; font-size: 20px; line-height: 28px; color: var(--brand-body); }
/* An optional tag at the panel's foot ("You sign off"): marks the steps the headline singles out. */
.tag { position: absolute; left: 24px; right: 24px; bottom: 28px; color: var(--brand-signal-text); }
</style>
</head>
<body><section class="slide" data-pattern="steps" data-variant="row" data-role="title-only">
<h1 class="headline" data-id="headline" data-bind="headline" data-claims="">The steps, and what they add up to together</h1>
<div class="row" data-id="steps">
  <div class="step" data-id="step-1"><svg class="tip" data-id="tip-1" width="20" height="36" viewBox="0 0 20 36"><path d="M0 0l20 18L0 36z" fill="currentColor"/></svg><p class="disc heavy" data-id="n-1" data-index="content.steps.0">1</p><p class="t heavy" data-id="t-1" data-bind="content.steps.0.label">Step 1</p><p class="d" data-id="d-1" data-bind="content.steps.0.note" data-claims="">What to do, in one line.</p><p class="eyebrow tag" data-id="g-1" data-bind="content.steps.0.tag" data-when="content.steps.0.tag">Tag</p></div>
  <div class="step" data-id="step-2"><svg class="tip" data-id="tip-2" width="20" height="36" viewBox="0 0 20 36"><path d="M0 0l20 18L0 36z" fill="currentColor"/></svg><p class="disc heavy" data-id="n-2" data-index="content.steps.1">2</p><p class="t heavy" data-id="t-2" data-bind="content.steps.1.label">Step 2</p><p class="d" data-id="d-2" data-bind="content.steps.1.note" data-claims="">What to do, in one line.</p><p class="eyebrow tag" data-id="g-2" data-bind="content.steps.1.tag" data-when="content.steps.1.tag">Tag</p></div>
  <div class="step" data-id="step-3"><svg class="tip" data-id="tip-3" width="20" height="36" viewBox="0 0 20 36"><path d="M0 0l20 18L0 36z" fill="currentColor"/></svg><p class="disc heavy" data-id="n-3" data-index="content.steps.2">3</p><p class="t heavy" data-id="t-3" data-bind="content.steps.2.label">Step 3</p><p class="d" data-id="d-3" data-bind="content.steps.2.note" data-claims="">What to do, in one line.</p><p class="eyebrow tag" data-id="g-3" data-bind="content.steps.2.tag" data-when="content.steps.2.tag">Tag</p></div>
</div>
</section>
</body></html>
