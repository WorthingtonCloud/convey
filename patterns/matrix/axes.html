<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Where each case lands on two questions</title>
<!-- Variant matrix / axes (title-only). Two rules cross in the middle, the axes named outside the grid (low to high); each quarter
     holds its head and a short list of what lands there, with no fills, so it reads as a map rather than four boxes.
     A quadrant with status "pick" gets a raised panel. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.plot { position: absolute; left: calc(var(--brand-margin-left) + 136px); top: var(--top); width: calc(var(--brand-content-width) - 136px);
  height: calc(var(--bottom) - var(--top) - 40px); }
.h { position: absolute; left: 0; top: calc(50% - 1px); width: 100%; height: 2px; background: var(--brand-rule); }
.v { position: absolute; left: calc(50% - 1px); top: 0; width: 2px; height: 100%; background: var(--brand-rule); }
.cells { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-wrap: wrap; }
.q { flex: 0 0 50%; height: 50%; padding: 18px 28px 20px; }
.qh { font-size: 28px; line-height: 32px; }
.pts { margin-top: 10px; list-style-type: "–  "; padding-left: 24px; font-size: 20px; line-height: 28px; color: var(--brand-body); }
.q.is-pick { background: var(--brand-raised); }
.xl .mid { color: var(--brand-ink); }
.xl { left: calc(var(--brand-margin-left) + 136px); top: calc(var(--bottom) - 24px); width: calc(var(--brand-content-width) - 136px);
  display: flex; justify-content: space-between; }
.yl { left: var(--brand-margin-left); top: var(--top); width: 116px; height: calc(var(--bottom) - var(--top) - 40px);
  display: flex; flex-direction: column; justify-content: space-between; }
.yl .mid { color: var(--brand-ink); }
</style>
</head>
<body><section class="slide" data-pattern="matrix" data-variant="axes" data-role="title-only">
<h1 class="headline" data-id="headline" data-bind="headline" data-claims="">Where each case lands on two questions, said as the pattern</h1>
<div class="plot" data-id="plot">
 <div class="cells" data-id="cells">
  <div class="q" data-id="q-1" data-class="content.quadrants.0.status"><p class="qh heavy" data-id="qh-1" data-bind="content.quadrants.0.head">Top left</p><ul class="pts" data-id="qp-1" data-bind="content.quadrants.0.points" data-claims=""><li>What lands here</li></ul></div>
  <div class="q" data-id="q-2" data-class="content.quadrants.1.status"><p class="qh heavy" data-id="qh-2" data-bind="content.quadrants.1.head">Top right</p><ul class="pts" data-id="qp-2" data-bind="content.quadrants.1.points" data-claims=""><li>What lands here</li></ul></div>
  <div class="q" data-id="q-3" data-class="content.quadrants.2.status"><p class="qh heavy" data-id="qh-3" data-bind="content.quadrants.2.head">Bottom left</p><ul class="pts" data-id="qp-3" data-bind="content.quadrants.2.points" data-claims=""><li>What lands here</li></ul></div>
  <div class="q" data-id="q-4" data-class="content.quadrants.3.status"><p class="qh heavy" data-id="qh-4" data-bind="content.quadrants.3.head">Bottom right</p><ul class="pts" data-id="qp-4" data-bind="content.quadrants.3.points" data-claims=""><li>What lands here</li></ul></div>
 </div>
 <div class="h" data-id="x-rule"></div><div class="v" data-id="y-rule"></div>
</div>
<div class="abs xl" data-id="x-axis"><p class="eyebrow" data-id="x-low" data-bind="content.x.low">Low</p><p class="eyebrow mid" data-id="x-label" data-bind="content.x.label">The question along the bottom</p><p class="eyebrow" data-id="x-high" data-bind="content.x.high">High</p></div>
<div class="abs yl" data-id="y-axis"><p class="eyebrow" data-id="y-high" data-bind="content.y.high">High</p><p class="eyebrow mid" data-id="y-label" data-bind="content.y.label">The question up the side</p><p class="eyebrow" data-id="y-low" data-bind="content.y.low">Low</p></div>
</section>
</body></html>
