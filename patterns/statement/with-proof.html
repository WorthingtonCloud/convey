<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One sentence the audience should repeat</title>
<!-- Variant statement / with-proof (full-bleed). One sentence at display size, its emphasis words in the signal color,
     then a strip of up to three proof points under a hairline. Everything stacks in one column, so a longer sentence
     pushes the strip down. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.stack { position: absolute; left: var(--bleed-left); top: 96px; width: var(--bleed-width); height: calc(544px - var(--caveat-row, 0px));
  display: flex; flex-direction: column; justify-content: center; }
.say { margin-top: 20px; font-size: 72px; line-height: 76px; max-width: 1060px; }
.hit { color: var(--brand-signal); }
.proof { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--brand-rule); display: flex; column-gap: 32px; }
.proof > div { flex: 1; }
.val { margin-top: 8px; font-size: 40px; line-height: 44px; }
.foot { margin-top: 28px; }
</style>
</head>
<body><section class="slide" data-pattern="statement" data-variant="with-proof" data-role="full-bleed">
<div class="field" data-id="field"></div>
<div class="stack" data-id="stack">
 <p class="eyebrow" data-id="kicker" data-bind="content.kicker" style="color:var(--brand-signal-text)">A short kicker</p>
 <h1 class="say heavy" data-id="statement" data-bind="headline" data-claims="">One sentence the audience should be able to repeat tomorrow</h1>
 <div class="proof" data-id="proof" data-when="content.proof">
  <div data-id="proof-1"><p class="eyebrow" data-id="proof-1-label" data-bind="content.proof.0.label" style="color:var(--brand-muted)">What was measured</p><p class="val heavy" data-id="proof-1-value" data-bind="content.proof.0.value" data-claims="">A number</p></div>
  <div data-id="proof-2"><p class="eyebrow" data-id="proof-2-label" data-bind="content.proof.1.label" style="color:var(--brand-muted)">What was measured</p><p class="val heavy" data-id="proof-2-value" data-bind="content.proof.1.value" data-claims="">A number</p></div>
  <div data-id="proof-3"><p class="eyebrow" data-id="proof-3-label" data-bind="content.proof.2.label" style="color:var(--brand-muted)">What was measured</p><p class="val heavy" data-id="proof-3-value" data-bind="content.proof.2.value" data-claims="">A number</p></div>
 </div>
 <p class="foot small" data-id="source" data-bind="content.source" data-claims="">Where the proof comes from.</p>
</div>
</section>
</body></html>
