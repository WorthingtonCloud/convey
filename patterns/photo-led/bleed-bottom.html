<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A headline the photo makes felt</title>
<!-- Variant photo-led / bleed-bottom (full-bleed). The photo fills the slide; a wash in the ground color rises from
     the foot, and the kicker, headline and subtitle sit on it. Best when the subject sits in the top half. -->
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.photo { left: 0; top: 0; width: 1280px; height: 720px; object-fit: cover; object-position: 50% 50%; }
.wash { left: 0; top: 0; width: 1280px; height: 720px;
  background: linear-gradient(0deg, var(--brand-field, var(--brand-ground)) 0%, var(--brand-field, var(--brand-ground)) 42%, transparent 88%); }
.stack { position: absolute; left: var(--bleed-left); top: 280px; width: var(--bleed-width); height: calc(372px - var(--caveat-row, 0px));
  display: flex; flex-direction: column; justify-content: flex-end; }
.kicker { color: var(--brand-signal-text); }
.say { margin-top: 12px; max-width: 1000px; font-size: 72px; line-height: 76px; }
.sub { margin-top: 20px; max-width: 760px; font-size: 24px; line-height: 32px; color: var(--brand-body); }
</style>
</head>
<body><section class="slide" data-pattern="photo-led" data-variant="bleed-bottom" data-role="full-bleed">
<div class="field" data-id="field"></div>
<img class="abs photo" data-id="photo" data-bind="content.image" alt="" src="photo.jpg">
<div class="abs wash" data-id="wash"></div>
<div class="stack" data-id="stack">
 <p class="eyebrow kicker" data-id="kicker" data-bind="content.kicker">A short kicker</p>
 <h1 class="say heavy" data-id="title" data-bind="headline" data-claims="">A headline the photo makes felt</h1>
 <p class="sub" data-id="subtitle" data-bind="content.subtitle" data-claims="">One line that says what the audience will get.</p>
</div>
</section>
</body></html>
